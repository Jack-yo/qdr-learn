<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quant Research · REAL_ONLY 界面骨架</title>
<style>
:root{color-scheme:dark;--bg:#090f1b;--panel:#121b2b;--edge:#2b3a50;--sub:#9aaac1;--ink:#f1f6ff;--teal:#57d5d0;--warn:#f7c37a}*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}.layout{display:flex;min-height:100vh}.sidebar{width:238px;flex-shrink:0;background:#101827;border-right:1px solid var(--edge);padding:24px 13px;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:800;letter-spacing:.3px;padding:0 13px 26px}.logo span{color:var(--teal)}.nav{display:grid;gap:4px}.nav button{display:block;width:100%;text-align:left;padding:12px 13px;background:transparent;border:0;border-radius:9px;color:#a7b9d2;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#1b3041;color:#e6fffb}.sidebar .foot{position:absolute;bottom:20px;left:20px;right:20px;font-size:12px;color:var(--sub);line-height:1.65}.main{flex:1;min-width:0}.top{height:72px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;padding:0 34px}.top small{color:var(--sub)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font-size:12px;background:#19243a;border:1px solid #34465e;padding:7px 10px;border-radius:20px;color:#c8d8eb}.chip.warn{color:var(--warn)}.content{max-width:1400px;padding:36px;margin:auto}.sectionLabel{font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:800}.heading h1{font-size:29px;margin:8px 0 10px}.heading p{color:var(--sub);line-height:1.8;margin:0 0 25px}.notice{border:1px solid #745832;background:#2c241c;color:#ffdfae;padding:16px 18px;border-radius:12px;line-height:1.75;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:22px;min-width:0}.card h3{margin:0 0 13px;font-size:16px}.card .desc{font-size:13px;color:var(--sub);line-height:1.75}.val{font-size:22px;font-weight:700;color:#d0dceb;margin:10px 0}.muted{color:var(--sub)}.blank{display:flex;align-items:center;justify-content:center;min-height:210px;text-align:center;border:1px dashed #465870;border-radius:11px;padding:24px;color:var(--sub);font-size:14px;line-height:1.85}.blank b{color:var(--ink);font-size:17px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:18px}.btn{color:#e5fefa;background:#153b40;border:1px solid #337d7c;border-radius:9px;padding:11px 14px;cursor:pointer}.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}.btn.secondary{background:#172237;color:var(--ink);border-color:#41516c}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{text-align:left;padding:13px 8px;border-bottom:1px solid var(--edge)}.table th{color:var(--sub);font-weight:500}.wide{grid-column:span 2}.right{margin-left:auto}.help{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.help.open{display:flex}.modal{width:min(560px,100%);background:#192337;border:1px solid #53627b;padding:25px;border-radius:15px;line-height:1.7}.modal h3{margin-top:0}@media(max-width:950px){.sidebar{width:170px}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.top{height:auto;min-height:72px;padding:15px;flex-wrap:wrap;gap:10px}.content{padding:22px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="logo">Quant<span>Lab</span></div><nav class="nav" id="navigation"></nav><div class="foot">REAL_ONLY 界面骨架<br>未连接数据或算法服务<br>不展示任何行情与预测</div></aside><main class="main"><div class="top"><div><strong>Quant Research</strong><br><small>研究工作台 / 无数据运行状态</small></div><div class="chips"><span class="chip warn">NOT_READY</span><span class="chip">REAL_ONLY</span><span class="chip">只读原型 · 不连接行情</span></div></div><div class="content" id="content"></div></main></div><div class="help" id="help"><div class="modal"><h3>接入真实数据的要求</h3><p>本 HTML 仅用于检查页面布局和交互空态，没有后端连接，也没有任何行情、模型预测或回测结果。正式系统必须经真实 API 授权、数据审计、时点与股票池能力检查后才能展示真实数值。</p><p>建议 Codex 先执行 G0、G1；不要把本文件作为数据源或回测逻辑。</p><button class="btn" id="close">关闭</button></div></div>
<script>
const pages=[['overview','研究总览','RESEARCH OVERVIEW','汇总真实市场环境、风格变化、研究进展及数据质量。'],['market','市场分析','MARKET REGIME','查看大盘历史状态、预测资格、样本外校准与下行风险。'],['styles','风格监控','FACTOR ROTATION','比较经典因子、ETF 风格代理以及研究中的状态变化。'],['factors','因子实验室','FACTOR RESEARCH','创建动量、反转、波动率、流动性、规模与质量因子实验。'],['strategies','策略工作台','STRATEGY BUILDER','将经过真实数据研究的因子和交易规则组成可审计策略。'],['backtests','回测中心','BACKTEST CENTER','运行经数据准入审核的历史回测，并区分探索与严格证据。'],['signals','每日信号','DAILY SIGNALS','只有数据与模型均满足条件时才展示实际候选股票。'],['paper','模拟组合','FORWARD PAPER','从真实开始日期追踪前向模拟，永不倒填历史成交。'],['data','数据与设置','DATA GOVERNANCE','管理真实数据权限、覆盖范围、数据时点与阻断原因。']];
const nav=document.getElementById('navigation'), content=document.getElementById('content');
function panel(title,desc,wide=false){return `<article class="card ${wide?'wide':''}"><h3>${title}</h3><div class="desc">${desc}</div><div class="blank"><div><b>暂无可用真实结果</b><br>尚未接入已审计的真实数据与运行结果<br>状态：NOT_READY / 来源待验证</div></div></article>`}
function draw(key){let p=pages.find(x=>x[0]===key)||pages[0];nav.innerHTML=pages.map(x=>`<button class="${x[0]===p[0]?'active':''}" data-id="${x[0]}">${x[1]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(b.dataset.id)); let blocks={overview:[['市场与风险状态','真实 SPY/宏观特征及运行状态'],['风格强弱','经典因子和 ETF 代理需有真实来源'],['每日 Alpha 候选','实际研究结果及数据资格'],['数据质量与覆盖','来源、日期、证券身份、公司行为'],['因子研究进度','真实 experiment_id 与不可变版本'],['前向模拟状态','仅从首次真实运行日开始记录']],market:[['市场概率','未校准或无真实标签时不展示概率'],['波动与下行风险','数据截止和波动估计必须可追溯'],['市场广度','需要历史合格股票池']],styles:[['经典风格收益','French 因子发布时点必须核对'],['风格转折','相对收益状态基于真实计算'],['ETF 风格代理','定义与经典纯因子不能混同']],factors:[['因子库','允许创建公式草稿；无合格数据不得运行'],['IC / 分组收益','仅真实特征和真实未来收益'],['因子覆盖率','缺失证券与时间必须显示']],strategies:[['策略构建器','市场→风格→个股 Alpha→风险限制'],['策略版本','保存草稿、校验及冻结需真实后端'],['因子依赖','对应数据资格逐项审查']],backtests:[['回测输入检查','历史成分、退市、公司行为、PIT、raw 成交价'],['净值与回撤','真实价格+明确的模型成交假设'],['样本外验证','严格训练/测试隔离并保存 hash']],signals:[['实际候选股票','不可显示任何虚构 Ticker 或预测概率'],['信号解释','必须有模型版本、数据来源和 as-of'],['风险与仓位','不提供实盘下单']],paper:[['组合持仓','仅记录真实前向运行中的模型模拟成交'],['事件账本','现金/持仓/股息/公司行为逐笔对账'],['运行状态','无法在今天补造过去 20 天的模拟历史']],data:[['数据源接入','Alpaca SIP raw / SEC / 法定许可历史源'],['历史完整性','永久证券 ID、退市、公司行为、行业与财报 PIT'],['能力准入','按数据能力阻断各类研究和回测']]};
content.innerHTML=`<header class="heading"><span class="sectionLabel">${p[2]}</span><h1>${p[1]}</h1><p>${p[3]}</p></header><div class="notice"><strong>真实数据未就绪：</strong>本页面不显示演示价格、策略收益或概率。请先配置合法数据源，并运行数据质量和时间可用性检查。缺少必需数据时保持阻断，不用虚构值补齐。</div><section class="grid">${blocks[p[0]].map((b,i)=>panel(b[0],b[1],p[0]==='backtests'&&i===1)).join('')}</section><div class="bottom"><span class="muted">来源：未接入 · 数据截止：未知 · 运行 ID：无 · 模型版本：无</span><button class="btn" id="helpbtn">查看接入要求</button></div>`;document.getElementById('helpbtn').onclick=()=>document.getElementById('help').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('help').classList.remove('open');document.getElementById('help').onclick=e=>{if(e.target.id==='help')e.target.classList.remove('open')};draw('overview');
</script></body></html>
