# V4 research protocol. This does not mutate the immutable v2.1 experiment.
experiment_id: qdr-v4-conditional-alpha
research_role: timestamped_rolling_oos
horizons: [1, 3, 5]
oos:
  min_training_sessions: 252
  training_window_sessions: 1260
  calibration_sessions: 126
  gap_sessions: 5
  min_calibration_per_class: 8
  ridge_alpha: 1.0
  logistic_c: 1.0
  downside_threshold: -0.02
  seed: 42
approval:
  source_pit_required: true
  independent_backtest_required: true
  probability_oos_calibration_required: true
  minimum_paired_oos_sessions: 60
  allow_broker_orders: false
notes:
  - Latest qualified data may be used for current rolling forecasts.
  - Repeatedly inspected historical years cannot be called independent unseen tests.
  - This config alone grants no dataset/model or paper execution capability.
