name: P0 tests
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q
