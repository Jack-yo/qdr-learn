<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>回测中心 · REAL_ONLY</title>
<style>body{font:15px system-ui;color:#19304b;background:#f4f7fb;margin:0}main{max-width:1160px;margin:auto;padding:30px}nav{display:flex;flex-wrap:wrap;gap:13px;margin-bottom:20px}a{color:#1666a3}section{background:#fff;border:1px solid #d9e1eb;border-radius:12px;padding:22px;margin:16px 0}h1{margin-bottom:7px}h2{font-size:19px}.muted{color:#51637b}.warn{background:#fff6e7;border-left:4px solid #c98b37;padding:14px}button,select{font:inherit;padding:9px 13px}button{cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:6px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e4e9ef}th{color:#627289}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<main><nav><a href="/overview">研究总览</a><a href="/market">市场分析</a><a href="/styles">风格监控</a><a href="/factors">因子实验室</a><a href="/strategies">策略工作台</a><a href="/backtests">回测中心</a><a href="/signals">每日信号</a><a href="/paper">模拟组合</a><a href="/data">数据与设置</a></nav>
<h1>回测中心</h1><p class="muted">真实来源和证据优先。历史数据不满足准入条件时不生成净值、交易成绩或虚假曲线。</p>
<section><h2>选择已冻结的策略</h2><div class="row"><label>策略版本<select id="strategy"></select></label><button id="preflight">核验严格回测资格</button><a href="/strategies">编辑策略</a></div><p id="status" role="status" class="warn">读取真实策略注册表…</p></section>
<section><h2>数据资格和执行障碍</h2><div class="scroll"><table><thead><tr><th>检查</th><th>状态</th><th>缺失证据</th></tr></thead><tbody id="checks"></tbody></table></div><p id="paths" class="muted"></p></section>
<section><h2>净值与逐笔记录</h2><p class="warn">只有真实源、历史可用时点、永久证券身份、完整公司行为与策略信号全部通过时，才能生成历史模拟成交。当前没有可核验的回测结果则显示 N/A。</p><p>净收益：<b id="return">N/A</b>　最大回撤：<b id="drawdown">N/A</b>　成交：<b id="fills">N/A</b></p></section>
</main><script>
const token='__TOKEN__';const by=id=>document.getElementById(id);let versions=[];
async function get(url,opt){const r=await fetch(url,opt);const x=await r.json();if(!r.ok)throw Error([x.code,x.message,x.status].filter(Boolean).join(' · '));return x}
function display(x){by('checks').replaceChildren();for(const [k,v] of Object.entries(x.checks||{})){const tr=document.createElement('tr');for(const val of [k,v.status,(v.missing_evidence||[]).join('；')||'—']){const td=document.createElement('td');td.textContent=val;tr.append(td)}by('checks').append(tr)}by('status').textContent=x.status+' · '+(x.research_grade?'研究级已核验':'当前未取得完整历史回测资格');by('paths').replaceChildren();for(const [label,key] of [['打开核验报告','report_path'],['查看核验证据','evidence_path']]){if(x[key]){const a=document.createElement('a');a.href='/'+x[key];a.textContent=label;a.target='_blank';a.style.marginRight='16px';by('paths').append(a)}}}
async function init(){try{const x=await get('/api/v1/strategies');versions=x.strategies||[];const select=by('strategy');select.replaceChildren();for(const v of versions){const o=document.createElement('option');o.value=v.id;o.textContent=v.name+' v'+v.version+' · '+v.status;select.append(o)}const params=new URLSearchParams(location.search);if(params.get('strategy')&&versions.some(v=>v.id===params.get('strategy')))select.value=params.get('strategy');by('status').textContent=versions.length?'选择策略并运行核验。':'没有已保存策略。请先建立策略版本。';by('preflight').disabled=!versions.length}catch(e){by('status').textContent='BLOCKED · '+e.message;by('preflight').disabled=true}}
by('preflight').onclick=async()=>{by('preflight').disabled=true;try{const v=versions.find(x=>x.id===by('strategy').value);if(!v||v.status!=='FROZEN')throw Error('必须先在策略工作台冻结版本');const data=await get('/api/v1/strategies/'+encodeURIComponent(v.id)+'/preflight',{method:'POST',headers:{'X-Console-Token':token,'Content-Type':'application/json'},body:'{}'});display(data)}catch(e){by('status').textContent='BLOCKED · '+e.message}finally{by('preflight').disabled=false}};init();
</script></html>
