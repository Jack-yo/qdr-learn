<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前向模拟账户 · REAL_ONLY</title>
<style>body{font:15px system-ui;background:#f4f7fb;color:#203047;margin:0}main{max-width:1100px;margin:auto;padding:30px}nav{display:flex;flex-wrap:wrap;gap:13px;margin-bottom:22px}a{color:#1766a1}section{background:white;border:1px solid #dfe5ed;border-radius:12px;padding:20px;margin:16px 0}.muted{color:#53657b}.warn{background:#fff4df;padding:14px;border-left:4px solid #bc7c14}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#f6f9fc;padding:16px;border:1px solid #e2e9f0;border-radius:9px}.card strong{display:block;font-size:20px;margin-top:10px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #e4e8ee}.scroll{overflow:auto}button{padding:9px 12px;cursor:pointer}</style>
<main><nav><a href="/overview">研究总览</a><a href="/market">市场分析</a><a href="/styles">风格监控</a><a href="/factors">因子实验室</a><a href="/strategies">策略工作台</a><a href="/backtests">回测中心</a><a href="/signals">每日信号</a><a href="/paper">模拟组合</a><a href="/data">数据与设置</a></nav>
<h1>前向模拟组合</h1><p class="muted">使用已经真实冻结的信号、次日真实 OHLCV 和模型成本估计续记。绝不发送真实订单，也不伪造过去的模拟成交。</p><section><div class="cards"><div class="card">账户状态<strong id="state">读取中…</strong></div><div class="card">现金余额<strong id="cash">N/A</strong></div><div class="card">持仓净值<strong id="equity">N/A</strong></div><div class="card">交易记录<strong id="fills">N/A</strong></div></div></section>
<section><h2>前向冻结记录</h2><p class="warn" id="block">等待真实账户状态。</p><div class="scroll"><table><thead><tr><th>交易日</th><th>数据来源</th><th>冻结时刻</th><th>价格记录数</th></tr></thead><tbody id="rows"></tbody></table></div><button id="refresh">重新核验</button></section>
<section><h2>执行资格</h2><p class="muted">只有当前证券身份、实际已观察行情、公司行为覆盖、历史已冻结模型和决策快照全部验收通过，才能续记前向模拟。没有完整证据时不得自动补充成交历史。</p><pre id="gaps"></pre></section>
</main><script>
const $=id=>document.getElementById(id);async function refresh(){try{const r=await fetch('/api/v1/paper');const d=await r.json();$('rows').replaceChildren();$('gaps').textContent='';$('state').textContent=d.status||'BLOCKED';$('block').textContent=d.message||d.code||d.error?.message||'尚无合格前向模拟账户';for(const rec of d.records||d.snapshots||[]){const tr=document.createElement('tr');for(const val of [rec.date||rec.asof_date_et||'N/A',rec.source||'N/A',rec.frozen_at_utc||rec.created_at_utc||'N/A',rec.rows||rec.verified_rows||'N/A']){const td=document.createElement('td');td.textContent=val;tr.append(td)}$('rows').append(tr)}$('gaps').textContent=JSON.stringify(d.missing_evidence||d.prerequisites||d.gaps||[],null,2);const acct=await fetch('/api/v1/paper/account').then(r=>r.json());if(acct.status==='INTERNALLY_RECONCILED_PAPER_ESTIMATE'){$('state').textContent='内部记账已对账（非外部成交核验）';$('cash').textContent=acct.cash.toFixed(2);$('equity').textContent=acct.equity.toFixed(2);$('fills').textContent=String(acct.fills);$('block').textContent=acct.notice}else{$('state').textContent='BLOCKED';$('block').textContent=acct.code||'缺少已验收模拟账本';}}catch(e){$('state').textContent='BLOCKED';$('block').textContent='读取失败：'+e.message}}$('refresh').onclick=refresh;refresh();</script></html>
