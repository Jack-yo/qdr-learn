<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据与设置 · REAL_ONLY</title>
<style>body{font:15px system-ui;color:#1e3249;background:#f4f7fb;margin:0}main{max-width:1200px;margin:auto;padding:30px}nav{display:flex;flex-wrap:wrap;gap:13px;margin-bottom:18px}a{color:#1866a2}section{padding:20px;border:1px solid #dbe3ec;border-radius:12px;background:#fff;margin:16px 0}pre{overflow-wrap:anywhere;white-space:pre-wrap;background:#f5f8fc;padding:14px;border-radius:7px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e1e7ee}table{width:100%;border-collapse:collapse}button{padding:8px 13px;cursor:pointer}.muted{color:#53667c}.warn{background:#fff3dc;border-left:4px solid #c68717;padding:14px}.scroll{overflow:auto}</style><main><nav><a href="/overview">研究总览</a><a href="/market">市场分析</a><a href="/styles">风格监控</a><a href="/factors">因子实验室</a><a href="/strategies">策略工作台</a><a href="/backtests">回测中心</a><a href="/signals">每日信号</a><a href="/paper">模拟组合</a><a href="/data">数据与设置</a></nav>
<h1>数据与设置</h1><p class="muted">真实来源、数据可用时间、哈希和各模块执行资格。API 凭据只在服务端环境变量中管理，不在网页回显。</p><section><h2>当前数据库与能力</h2><p class="warn" id="status">读取状态…</p><pre id="summary"></pre><div class="scroll"><table><thead><tr><th>能力</th><th>状态</th><th>缺少的证据</th></tr></thead><tbody id="caps"></tbody></table></div><button id="reload">重新读取</button></section><section><h2>数据目录</h2><p id="catstatus" class="muted"></p><div class="scroll"><table><thead><tr><th>数据集</th><th>来源</th><th>数量</th><th>截止日期</th><th>可用性</th></tr></thead><tbody id="catalog"></tbody></table></div><p><a href="/api/v1/data/catalog/datasets.csv">导出数据审计 CSV</a></p></section></main>
<script>const $=id=>document.getElementById(id);function row(target,values){const tr=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=String(value??'N/A');tr.append(td)}$(target).append(tr)}async function refresh(){try{const res=await fetch('/api/v1/system/status');const d=await res.json();$('caps').replaceChildren();$('status').textContent=d.error?'BLOCKED · '+(d.error.code||'数据不可用'):'当前读取状态：'+(d.dataset?.mode||'DATA_UNAVAILABLE');$('summary').textContent=JSON.stringify({source:d.dataset?.source,asof:d.dataset?.asof_date_et,rows:d.dataset?.rows,feed:d.dataset?.feed,provenance:d.dataset?.source_provenance,mode:d.dataset?.mode},null,2);for(const [name,c] of Object.entries(d.capabilities||{}))row('caps',[name,c.status,(c.missing_evidence||[]).join('；')||'—'])}catch(e){$('status').textContent='BLOCKED · '+e.message}try{const res=await fetch('/api/v1/data/catalog');const d=await res.json();$('catalog').replaceChildren();$('catstatus').textContent=res.ok?'数据目录读取完成':'数据目录不可用：'+(d.code||res.status);for(const v of d.datasets||[])row('catalog',[v.name,v.source,v.rows,v.last_date,v.status])}catch(e){$('catstatus').textContent='数据目录不可用：'+e.message}}$('reload').onclick=refresh;refresh();</script></html>
